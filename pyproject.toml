[project]
name = "cashcannon"
version = "0.1.0"
description = "MoneyPrinter CashCannon: topic → finished short video. AI script, voice, visuals, music and karaoke captions — powered by Genosai API + Remotion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.7",
  "loguru>=0.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
mlx = ["mlx-whisper>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cannon = "cashcannon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cashcannon"]
